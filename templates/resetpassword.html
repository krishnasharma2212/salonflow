{% extends "base.html" %}
{% block title %}Reset Password – SalonFlow{% endblock %}
{% block extra_css %}
<style>
body{background:var(--g50);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{background:var(--w);border-radius:24px;box-shadow:0 20px 60px rgba(13,148,136,.12),0 4px 16px rgba(0,0,0,.07);padding:48px 44px;width:100%;max-width:440px}
.logo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:32px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--t700),var(--t500));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem}
.logo-txt{font-family:var(--df);font-size:1.4rem;font-weight:700;color:var(--t800)}
.icon-ring{width:72px;height:72px;background:var(--t50);border:2px solid var(--t200);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:1.7rem;color:var(--t600)}
h1{font-family:var(--df);font-size:2rem;font-weight:700;color:var(--g900);margin-bottom:6px;text-align:center}
.sub{font-size:.88rem;color:var(--g500);line-height:1.65;margin-bottom:28px;text-align:center}
.field{margin-bottom:18px}
.field label{display:block;font-size:.8rem;font-weight:600;color:var(--g700);margin-bottom:6px}
.inp-pw{position:relative}
.inp{width:100%;padding:12px 16px;background:var(--g50);border:1.5px solid var(--g200);border-radius:10px;font-size:.92rem;color:var(--g900);transition:var(--ease);outline:none}
.inp:focus{border-color:var(--t500);background:#fff;box-shadow:0 0 0 3px rgba(13,148,136,.1)}
.inp-pw .inp{padding-right:44px}
.pw-tog{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--g400);font-size:.88rem;transition:color .2s}
.pw-tog:hover{color:var(--t600)}
.ps-bar{height:3px;background:var(--g100);border-radius:2px;overflow:hidden;margin-top:6px}
.ps-fill{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0%}
.ps-lbl{font-size:.7rem;color:var(--g400);margin-top:3px}
.btn-full{width:100%;padding:13px;background:var(--t600);color:#fff;border:none;border-radius:11px;font-size:.95rem;font-weight:700;cursor:pointer;transition:var(--ease);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;margin-bottom:16px}
.btn-full:hover{background:var(--t700);transform:translateY(-1px);box-shadow:0 6px 20px rgba(13,148,136,.3)}
.back-link{font-size:.84rem;color:var(--g400);text-align:center}
.back-link a{color:var(--t600);font-weight:600}
</style>
{% endblock %}
{% block body %}
<div class="card">
  <a href="/" class="logo">
    <div class="logo-icon"><i class="fas fa-scissors"></i></div>
    <span class="logo-txt">SalonFlow</span>
  </a>
  <div class="icon-ring"><i class="fas fa-key"></i></div>
  <h1>Set New Password</h1>
  <p class="sub">Choose a strong password for your SalonFlow account.</p>

  <form method="POST" action="{{ url_for('reset_password', token=token) }}" id="reset-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label>New Password</label>
      <div class="inp-pw">
        <input type="password" name="password" id="pw" class="inp" placeholder="At least 8 characters" required oninput="chkPw(this.value)">
        <button type="button" class="pw-tog" onclick="togPw('pw',this)"><i class="fas fa-eye"></i></button>
      </div>
      <div class="ps-bar"><div class="ps-fill" id="ps-fill"></div></div>
      <div class="ps-lbl" id="ps-lbl"></div>
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <div class="inp-pw">
        <input type="password" name="confirm_password" id="cpw" class="inp" placeholder="Repeat your password" required>
        <button type="button" class="pw-tog" onclick="togPw('cpw',this)"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <button type="submit" class="btn-full"><i class="fas fa-check"></i> Reset Password</button>
  </form>
  <p class="back-link"><a href="{{ url_for('auth_login') }}"><i class="fas fa-arrow-left"></i> Back to Sign In</a></p>
</div>
<script>
function togPw(id,btn){const i=document.getElementById(id);const s=i.type==='password';i.type=s?'text':'password';btn.querySelector('i').className='fas fa-eye'+(s?'-slash':'');}
function chkPw(v){
  const fill=document.getElementById('ps-fill');const lbl=document.getElementById('ps-lbl');
  let s=0;if(v.length>=8)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
  const c=[[],[25,'#ef4444','Weak'],[50,'#f59e0b','Fair'],[78,'#3b82f6','Good'],[100,'#10b981','Strong']];
  const r=c[Math.max(s,v.length?1:0)];
  fill.style.width=r[0]+'%';fill.style.background=r[1];
  lbl.textContent=r[2]||'';lbl.style.color=r[1];
}
</script>
{% endblock %}
